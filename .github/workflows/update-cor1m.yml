name: Update COR1M

on:
  workflow_dispatch:
  schedule:
    - cron: "35 23 * * 1-5"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: update-cor1m
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install updater dependencies
        run: python -m pip install pandas==3.0.3 yfinance==1.5.1

      - name: Fetch and upsert latest COR1M value
        run: >-
          python scripts/update_cor1m.py
          --csv CBOE_1Month_Implied_Correlation_Historical_Data.csv
          --max-business-day-lag 2

      - name: Detect CSV changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- CBOE_1Month_Implied_Correlation_Historical_Data.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated observation
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CBOE_1Month_Implied_Correlation_Historical_Data.csv
          git commit -m "Update COR1M daily value"
          git push
